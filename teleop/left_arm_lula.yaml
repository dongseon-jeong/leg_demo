# The robot description defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF.
# Lula will only use these joints to control the robot position.
cspace:
    - lshd_pitch_joint
    - lshd_yaw_joint
    - lshd_roll_joint
    - lelbow_joint
    - lwrist_pitch_joint
    - lwrist_yaw_joint

default_q: [
    -0.0049, -0.0014, -0.0073, -0.0, -0.0003, 0.0127
]

acceleration_limits: [
   10,10,10,10,10,10
]

jerk_limits: [
   10000,10000,10000,10000,10000,10000
]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted or how values in the URDF should be overwritten.

cspace_to_urdf_rules:
    - {name: lbase_joint, rule: fixed, value: -0.0}
    - {name: neck_roll_joint, rule: fixed, value: 0.0}
    - {name: rbase_joint, rule: fixed, value: 0.0}
    - {name: ll1_joint, rule: fixed, value: 0.0002}
    - {name: neck_pitch_joint, rule: fixed, value: -0.0}
    - {name: rl1_joint, rule: fixed, value: -0.0002}
    - {name: ll2_joint, rule: fixed, value: 0.002}
    - {name: rl2_joint, rule: fixed, value: -0.0018}
    - {name: ll3_joint, rule: fixed, value: 1e-04}
    - {name: rl3_joint, rule: fixed, value: -1e-04}
    - {name: ll4_joint, rule: fixed, value: -0.0027}
    - {name: rl4_joint, rule: fixed, value: 0.0026}
    - {name: ll5_joint, rule: fixed, value: -1e-04}
    - {name: rl5_joint, rule: fixed, value: 1e-04}
    - {name: lgrip_fin1_slider, rule: fixed, value: -0.0004}
    - {name: lgrip_fin2_slider, rule: fixed, value: -0.0004}
    - {name: lgripper_joint, rule: fixed, value: 0.0004}
    - {name: rgrip_fin1_slider, rule: fixed, value: 0.007}
    - {name: rgrip_fin2_slider, rule: fixed, value: 0.02}
    - {name: rgripper_joint, rule: fixed, value: 0.005}
    - {name: rshd_pitch_joint, rule: fixed, value: -0.6812}
    - {name: rshd_yaw_joint, rule: fixed, value: 0.0095}
    - {name: rshd_roll_joint, rule: fixed, value: -0.2247}
    - {name: relbow_joint, rule: fixed, value: -0.4012}
    - {name: rwrist_pitch_joint, rule: fixed, value: -0.0051}
    - {name: rwrist_yaw_joint, rule: fixed, value: 0.0258}



# Lula uses collision spheres to define the robot geometry in order to avoid
# collisions with external obstacles.  If no spheres are specified, Lula will
# not be able to avoid obstacles.

collision_spheres:
